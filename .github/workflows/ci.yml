name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libspeexdsp-dev
      - name: Install Zig 0.14.1
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          sudo tar -C /usr/local -xf /tmp/zig.tar.xz
          echo /usr/local/zig-x86_64-linux-0.14.1 >> "$GITHUB_PATH"
      - name: Test
        run: zig build test
      - name: Release binary
        run: |
          zig build -Doptimize=ReleaseFast
          sh scripts/check-ldd.sh zig-out/bin/nearmic
          ./zig-out/bin/nearmic qa
      - name: Bake-off
        run: zig build bakeoff -Doptimize=ReleaseFast
