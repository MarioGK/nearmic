# NearMic appliance: package maintenance must never touch the audio path.
# RK3399 CPUs 4-5 are the Cortex-A72 pair that runs NearMic; keep apt, dpkg
# and unattended-upgrades on the A53 cores at idle CPU and I/O priority.
# Installed as a drop-in for apt-daily, apt-daily-upgrade and
# unattended-upgrades.
[Service]
CPUAffinity=0-3
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
