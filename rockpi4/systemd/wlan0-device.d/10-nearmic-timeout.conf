# netplan's Wi-Fi unit (netplan-wpa-wlan0.service) is ordered before
# network.target and waits for the wlan0 device. systemd waits 90 s for a
# device that is not there, network.target waits with it, user sessions wait
# for network.target, and the microphone lives in a user session: a boot
# without the Wi-Fi adapter started NearMic 97 s after power-on instead of
# about 10 s (measured 2026-11-12). Give the adapter 12 s; if it shows up
# later, 70-nearmic-wifi.rules starts the Wi-Fi unit then.
[Unit]
JobRunningTimeoutSec=12s
