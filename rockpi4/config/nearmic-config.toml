# NearMic appliance configuration for the ROCK 4 Plus v1.73.
# Installed once by apply-appliance.sh; an existing file is never overwritten.
#
# profile = "rock-pi-plus" keeps the RK3399 budget at 0.80; RNNoise itself is
# single-threaded, so threads = 1 is explicit.  The rock DSP pool remains
# available for the legacy engines.
# engine = "deepfilter" is DeepFilterNet3 (full-band 48 kHz), embedded in the
# binary and run on the two A72 cores; it keeps the speech level, so
# gain_db = 0 (RNNoise needed 10).  engine = "rnnoise" is the lighter
# fallback: 20 ms less delay, more residual noise, "robotic" on far speech.
# voice.Post adds the closeness EQ, a speech leveler, a speech gate keyed on
# the model's local SNR, and a look-ahead limiter.  See QUALITY.md.
# listen = false keeps the processed voice out of the board speakers.
#
# source is the PipeWire node.name of the real USB microphone.  Leaving it
# empty makes NearMic capture whichever source is the default when the daemon
# starts, which is racy on a headless boot.  Set it explicitly after the USB
# microphone is connected.  Discover the name with:
#   pw-cli ls Node | grep -E 'node.name|media.class'
# Example (Maono ProStudio 2x2 Lite):
#   source = "alsa_input.usb-Maono_ProStudio_2x2_Lite_Maono_ProStudio_2x2_Lite-00.analog-stereo"
profile = "rock-pi-plus"
engine = "deepfilter"
mode = "suppress"
listen = false
gain_db = 0
source = ""
threads = 1
cpu_budget = 0.80
