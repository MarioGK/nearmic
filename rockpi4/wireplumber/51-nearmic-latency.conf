## Low-latency, always-on PipeWire defaults for the NearMic UAC2 gadget.
##
## Two things on this board add latency to the microphone the host sees:
##
## 1. Suspend-on-idle. WirePlumber closes an idle ALSA node after a few
##    seconds. When the host starts capturing, the gadget node, the NearMic
##    capture stream and the Maono interface all have to restart, which is
##    heard as a lag between starting to talk and the microphone working.
##    The whole chain stays hot here instead: the UAC2 gadget is the clock and
##    the host keeps it streaming, so nothing has to be reopened.
##
## 2. Period size. The ALSA layer buffers `period-num * period-size` frames and
##    PipeWire wakes up once per period. The stock 16 x 1024 frames put up to
##    340 ms of stale audio in front of the host's first sample; 16 x 128 is
##    43 ms of capacity with 2.7 ms of granularity.
##
## `nearmic-default-sink` also forces the graph quantum to 128 on the board.
## Keep the two in step: a larger quantum here would undo the smaller periods.
##
## The period props go on the node rules, not on a device rule: PipeWire's
## ALSA monitor reads them from the node when it opens the PCM, and a device
## rule is ignored for these two keys on this PipeWire/WirePlumber pair.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(input|output).platform-fe800000.usb.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.period-num = 16
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Maono.*"
      }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
